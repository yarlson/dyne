version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - goprintffuncname
    - misspell
    - modernize
    - nlreturn
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - whitespace
    - wsl_v5
  settings:
    nlreturn:
      block-size: 1
    wsl_v5:
      default: none
      enable:
        - after-block
  exclusions:
    generated: lax
    presets:
      - common-false-positives

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: lax
  settings:
    gofumpt:
      module-path: github.com/yarlson/dyne
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/yarlson/dyne
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
